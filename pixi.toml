[workspace]
authors = ["Tommaso Ghilardi <tommaso.ghilardi93@gmail.com>"]
channels = ["conda-forge"]
name = "Kirgik"
platforms = ["win-64"]
version = "0.1.0"

[dependencies]
python = "3.10.*"

[pypi-dependencies]
dvst-detox = { git = "https://github.com/TommasoGhilardi/DeToX.git", branch = "dev" }
psychopy = "==2025.1.1"
tobii-research = ">=2.1.0, <3"
opencv-python = ">=5.0.0.93, <6"

[tasks]
hide-and-seek = "python -m HideAndSeek.HideAndSeek"
what-babies-know = "python -m WhatBabiesKnow.WhatBabiesKnow"
information-gain = "python -m InformationGain.InformationGain"
features-to-functions = "python -m Features2Functions.Features2Functions"
