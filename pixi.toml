[workspace]
authors = ["Tommaso Ghilardi <tommaso.ghilardi93@gmail.com>"]
channels = ["conda-forge"]
name = "Kirgik"
platforms = ["win-64"]
version = "0.1.0"

[dependencies]
python = "==3.10.22"

[pypi-dependencies]
# Pin the tested development snapshot, not the moving dev branch.
psychopy = { git = "https://github.com/psychopy/psychopy.git", rev = "ba68a2738c3795c3f2b930571c91324a8cdadc81" }
dvst-detox = { git = "https://github.com/TommasoGhilardi/DeToX.git", rev = "ee04af0ab94c24518a0daec2d7fc8a8b42caaaa1" }
tobii-research = "==2.1.0"
opencv-python = "==5.0.0.93"
numpy = "==2.2.6"
psychtoolbox = "==3.0.19.14"
ffpyplayer = "==4.5.3"
av = "==17.1.0"
pyglet = "==2.1.19"
pyqt6 = "==6.11.0"
wxpython = "==4.3.1"
tables = "==3.10.1"

[tasks]
hide-and-seek = "python -m HideAndSeek.HideAndSeek"
what-babies-know = "python -m WhatBabiesKnow.WhatBabiesKnow"
information-gain = "python -m InformationGain.InformationGain"
features-to-functions = "python -m Features2Functions.Features2Functions"
